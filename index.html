<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-animation-component@^4.1.2/dist/aframe-animation-component.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.x.x/dist/aframe-event-set-component.min.js"></script>
  </head>
  <body>
    <a-scene xr-mode-ui="enabled:false"
              fog="type: linear; color: #0a0a43; far: 45; near: 0"
              loading-screen="dotsColor: red; backgroundColor: black">

      <a-assets>
        <a-asset-item
          id="car"
          src="https://raw.githubusercontent.com/josharaedwards/Project-Anima/b8c4458c12033884799d26aaa85dd0b1784e5a14/WebDev/Models/car.glb">
        </a-asset-item>

        <a-asset-item
          id="streetlight"
          src="https://raw.githubusercontent.com/josharaedwards/Project-Anima/e43d84128f042adfe5f63e25bbd8d66b63c8a4aa/WebDev/Models/streetLight1.glb">
        </a-asset-item>

        <a-asset-item
          id="streetAndSidewalk"
          src="https://raw.githubusercontent.com/josharaedwards/Project-Anima/3cf08c440c1db75725f668b5e088c5236ae7ee86/WebDev/Models/Baobab%20Crossroads.glb"
          >
        </a-asset-item>

        <a-asset-item
          id="train"
          src="https://raw.githubusercontent.com/josharaedwards/Project-Anima/4f2cbdc80459a85b613c8dde9262ab3cf85afe8e/WebDev/Models/Baobab%20Train.glb">
        </a-asset-item>

        <a-mixin
          id="streetlightFrame"
          gltf-model="#streetlight">
        </a-mixin>

        <a-mixin
          id="streetlightLamp"
          geometry="primitive: box"
          material="emissive: #edf104" 
          position="0 3.4 1.32" 
          scale="0.2 0.45 0.2"
          rotation="-90 0 0"
          light="angle: 40; color: #edf104; distance: 100; intensity: 2; penumbra: 0.2; type: spot; castShadow: true">
        </a-mixin>

        <a-mixin
          id="streetlightRay"
          geometry="primitive: sphere; thetaLength: 90"
          material="opacity: 0.3; blending: normal; emissive: #e9e21c; emissiveIntensity: 3"
          position="0 3.37723 1.29403"
          scale="0.5 0.5 0.5"
          rotation="0 -180 -180">
        </a-mixin>

      </a-assets>

      <a-entity
        id="pc"
        camera
        look-controls="enabled:true; magicWindowTrackingEnabled:true"
        wasd-controls="enabled:false"
        position="0 2 0">
        <a-entity
          raycaster="objects:.clickable"
          cursor="fuse:true; fuseTimeout:800"
          geometry="primitive:triangle; vertexA:0 -0.040 0; vertexB: -0.050 -0.1 0; vertexC:0.050 -0.1 0"
          material="color:#83f9fb; shader:flat"
          position="0 0 -2"
          scale="1 1 1"
          animation__fusing="property:scale; from: 1 1 1; to:0.2 0.2 0.2; startEvents:fusing"
          animation__reset="property:scale; to:1 1 1; dur: 100; startEvents:mouseleave">
          <a-circle
            position="0 -0.07 0.5"
            scale="0.4 0.4 0.4"
            radius="0.05"
            material="color:#f2f75e; shader:flat">
          </a-circle>
          <a-triangle
            scale="1.1 1 1"
            material="color:black; shader:flat; wireframe:true"
            vertex-a="0 -0.040 0"
            vertex-b="-0.050 -0.1 0"
            vertex-c="0.050 -0.1 0">
          </a-triangle>
        </a-entity>
      </a-entity>

      <a-sky
        id="sky"
        src="https://raw.githubusercontent.com/josharaedwards/Project-Anima/42b995f0c959db1ce651d383349005225226df89/WebDev/Images/sky2.jpg"
        radius="70"
        material="emissive: #eedddd; emissiveIntensity: 50">
      </a-sky>

      <a-entity
        id="moon"
        class="clickable"
        geometry="primitive:sphere"
        material="color:white; emissive:#e8803b; emissiveIntensity:2"
        light="type:point; color:#7980fc; castShadow:true; shadowBias:-0.1"
        position="4.7 11 -10">
      </a-entity>

      <a-entity
        id="car"
        class="clickable"
        gltf-model="#car"
        position="-3.85692 0 -12"
        rotation="0 83 0"
        animation__hover="property:position; dir:alternate; dur:2400; loop:1; easing:easeInSine; from:-3.85692 0 -12; to:-3.85692 0.9 -12; startEvents: click"
        animation__tilt="property:rotation; dir:alternate; dur:1500; delay:600; loop:1; easing:easeInOutQuad; from:0 83 0; to:7 83 -5; startEvents: click">
        <a-entity 
          id="wheel1"
          geometry="primitive: circle; radius: 0.37; segments: 16" 
          position="-0.88407 0.39659 0.98941" 
          material="emissive: #89e8f5; emissiveIntensity: 1.36; wireframe: true; wireframeLinewidth: 1"
          animation__wheelSpin="property:rotation; dir:alternate; dur:800; easing:easeInSine; loop:true; to: 0 0 270">
        </a-entity>
        <a-entity 
          id="wheel2" 
          geometry="primitive: circle; radius: 0.37; segments: 16"
          position="1.05146 0.39659 0.98941" 
          material="emissive: #89e8f5; emissiveIntensity: 1.36; wireframe: true; wireframeLinewidth: 1"
          animation__wheelSpin="property:rotation; dir:alternate; dur:800; easing:easeInSine; loop:true; to: 0 0 270">
        </a-entity>
        <a-entity
          id="underLight"
          light="color: #89e8f5; distance:3; intensity:2; type: point">
        </a-entity>
        <a-entity
          id="grill"
          geometry="primitive:box"
          position="-1.69529 0.56764 0.06821" 
          scale="0.26649 0.307 1.21612"
          material="emissive: #27e619; emissiveIntensity:2; wireframe: false; wireframeLinewidth: 5">
        </a-entity>
      </a-entity>

      <a-entity
        id="jaera">
        <a-plane
          id="jaeRaBody"
          class="clickable"
          position="0 1.4 -4"
          scale="2.5 2.5 1"
          src="https://raw.githubusercontent.com/josharaedwards/Project-Anima/b24559ca6550d6bc9f85e590dde783d827ba7730/WebDev/Images/jaeraStanding.png"
          material="transparent:true"
          event-set__maskOn="_event: mouseenter; _target: #jaeRaMask; visible: true"
          event-set__maskOff="_event: mouseleave; _target: #jaeRaMask; visible: false"
          event-set__waveActive="_event: click; _target: #jaeRaLight; animation__wave.to: 4.5"
          event-set__waveInactive="_event: mouseleave; _target: #jaeRaLight; animation__wave.to: 3.5"
          event-set__magicPulseActive="_event: click; _target: #jaeRaMagic; animation__magicPulse.to: 0.6"
          event-set__magicPulseInactive="_event: mouseleave; _target: #jaeRaMagic; animation__magicPulse.to: 0.5"
          event-set__magicSpinActive="_event: click; _target: #jaeRaMagic; animation__magicSpin.dur: 3000"
          event-set__magicSpinInactive="_event: mouseleave; _target: #jaeRaMagic; animation__magicSpin.dur: 6000">
          <a-plane
            id="jaeRaMask" 
            position="-0.046 0.22515 0.107" 
            scale="0.18 0.18 1" 
            src="https://raw.githubusercontent.com/josharaedwards/Project-Anima/b24559ca6550d6bc9f85e590dde783d827ba7730/WebDev/Images/jaeraMask.png"
            material="alphaTest: 1; transparent:true">
          </a-plane>
          <a-plane
            id="jaeRaMagic"
            position="0.16 0.33817 -0.107"
            scale="0.4 0.4 1"
            src="https://raw.githubusercontent.com/josharaedwards/Project-Anima/1f0a1500573a8b8784190bf1c6d9db79994f4936/WebDev/Images/jaeRaSigil.png"
            material="alphaTest: 1; transparent:true"
            animation__magicSpin="property:rotation; dur:6000; easing:easeInSine; loop:true; from: 0 0 0; to: 0 0 360"
            animation__magicPulse="property:scale; dur:2000; dir:alternate; easing:easeInSine; loop:true; from: 0.4 0.4 1; to: 0.5 0.5 1">
          </a-plane>
        </a-plane>
        <a-light 
          id="jaeRaLight"
          type="point" 
          position="0.48385 2.23 -3.52736" 
          light="color: #f0eee4; distance: 4; intensity: 1"
          animation__wave="property:distance; dir:alternate; dur:2000; easing:easeInSine; loop:true; from:2.5; to:3">
        </a-light>
      </a-entity>

      <a-entity 
        id="streetlight_NW_R1" 
        mixin="streetlightFrame" 
        position="-7.67 0.5 -5.96" 
        rotation="0 0 0">
        <a-entity mixin="streetlightLamp"></a-entity>
        <a-entity mixin="streetlightRay"></a-entity>
      </a-entity>

      <a-entity 
        id="streetlight_NW_R2" 
        mixin="streetlightFrame" 
        position="-14.19 0.5 -5.96" 
        rotation="0 0 0">
        <a-entity mixin="streetlightLamp"></a-entity>
        <a-entity mixin="streetlightRay"></a-entity>
      </a-entity>

      <a-entity 
        id="streetlight_NW_R3" 
        mixin="streetlightFrame" 
        position="-20.71 0.5 -5.96" 
        rotation="0 0 0">
        <a-entity mixin="streetlightLamp"></a-entity>
        <a-entity mixin="streetlightRay"></a-entity>
      </a-entity>

      <a-entity 
        id="streetlight_NW_R4" 
        mixin="streetlightFrame" 
        position="-27.23 0.5 -5.96" 
        rotation="0 0 0">
        <a-entity mixin="streetlightLamp"></a-entity>
        <a-entity mixin="streetlightRay"></a-entity>
      </a-entity>

      <a-entity
        id="streetlight_NE_R1"
        mixin="streetlightFrame"
        position="8.33 0.5 -5.96"
        rotation="0 0 0">
        <a-entity mixin="streetlightLamp"></a-entity>
        <a-entity mixin="streetlightRay"></a-entity>
      </a-entity>

      <a-entity
        id="streetlight_NE_R2"
        mixin="streetlightFrame"
        position="14.85 0.5 -5.96"
        rotation="0 0 0">
        <a-entity mixin="streetlightLamp"></a-entity>
        <a-entity mixin="streetlightRay"></a-entity>
      </a-entity>

      <a-entity 
        id="streetlight_NE_R3" 
        mixin="streetlightFrame" 
        position="23.1 0.5 -5.96" 
        rotation="0 0 0">
        <a-entity mixin="streetlightLamp"></a-entity>
        <a-entity mixin="streetlightRay"></a-entity>
      </a-entity>

      <a-entity 
        id="streetlight_NE_R4" 
        mixin="streetlightFrame" 
        position="33.36 0.5 -5.96" 
        rotation="0 0 0">
        <a-entity mixin="streetlightLamp"></a-entity>
        <a-entity mixin="streetlightRay"></a-entity>
      </a-entity>

      <a-entity 
        id="streetlight_SW_R1" 
        mixin="streetlightFrame" 
        position="-7.67 0.5 5.96" 
        rotation="0 180 0">
        <a-entity mixin="streetlightLamp"></a-entity>
        <a-entity mixin="streetlightRay"></a-entity>
      </a-entity>

      <a-entity 
        id="streetlight_SW_R2" 
        mixin="streetlightFrame" 
        position="-14.19 0.5 5.96" 
        rotation="0 180 0">
        <a-entity mixin="streetlightLamp"></a-entity>
        <a-entity mixin="streetlightRay"></a-entity>
      </a-entity>

      <a-entity 
        id="streetlight_SW_R3" 
        mixin="streetlightFrame" 
        position="-20.71 0.5 5.96" 
        rotation="0 180 0">
        <a-entity mixin="streetlightLamp"></a-entity>
        <a-entity mixin="streetlightRay"></a-entity>
      </a-entity>

      <a-entity 
        id="streetlight_SW_R4" 
        mixin="streetlightFrame" 
        position="-27.23 0.5 5.96" 
        rotation="0 180 0">
        <a-entity mixin="streetlightLamp"></a-entity>
        <a-entity mixin="streetlightRay"></a-entity>
      </a-entity>

      <a-entity 
        id="streetlight_SE_R1" 
        mixin="streetlightFrame" 
        position="8.33 0.5 5.96" 
        rotation="0 180 0">
        <a-entity mixin="streetlightLamp"></a-entity>
        <a-entity mixin="streetlightRay"></a-entity>
      </a-entity>

      <a-entity 
        id="streetlight_SE_R2" 
        mixin="streetlightFrame" 
        position="14.85 0.5 5.96" 
        rotation="0 180 0">
        <a-entity mixin="streetlightLamp"></a-entity>
        <a-entity mixin="streetlightRay"></a-entity>
      </a-entity>

      <a-entity 
        id="streetlight_SE_R3" 
        mixin="streetlightFrame" 
        position="23.1 0.5 5.96" 
        rotation="0 180 0">
        <a-entity mixin="streetlightLamp"></a-entity>
        <a-entity mixin="streetlightRay"></a-entity>
      </a-entity>

      <a-entity 
        id="streetlight_SE_R4" 
        mixin="streetlightFrame" 
        position="33.36 0.5 5.96" 
        rotation="0 180 0">
        <a-entity mixin="streetlightLamp"></a-entity>
        <a-entity mixin="streetlightRay"></a-entity>
      </a-entity>

      <a-entity
        id="streetAndsideWalk"
        gltf-model="#streetAndSidewalk"
        position="0 0 0">
      </a-entity>

      <a-entity
        id="trainMoving"
        gltf-model="#train"
        position="80 14.5 -26"
        animation="dir: alternate; dur: 9000; loop: true; property: position; to: -100 14.5 -26">
        <a-entity
          id="frontLight" 
          light="color: #f5827a; distance: 3.5; intensity: 30; type: point; castShadow: true; shadowBias: -0.1" 
          position="-20.31074 1.31167 -1.11936">
        </a-entity>
        <a-entity
          id="backLight" 
          light="color: #f5827a; distance: 3.5; intensity: 30; type: point; castShadow: true; shadowBias: -0.1" 
          position="9.97679 1.31167 -1.11936">
        </a-entity>
      </a-entity>

      <a-entity
        id="billboardLight"
        light="color: #f5f5f5; distance: 5; intensity: 10; type: point; castShadow: true; shadowBias: -0.1"
        position="-11.256 8.523 -20.46057">
      </a-entity>

      <a-entity 
        id="surprise"
        class="clickable" 
        geometry="" 
        position="1.8099 0.299 -0.24305" 
        scale="0.44645 0.12218 0.7"
        material="blending:additive; color: #ce1c1c"
        animation__wormhole="property:rotation; from: 0 0 0; to: 0 360 0; dur 2000; startEvents:fusing"
        animation__reset="property:rotation; to: 0 0 0; dur 100; startEvents:mouseleave"
        link="backgroundColor: #b324c6; href: https://jesgrewsoul.itch.io/anomaly-zine-by-jaera; on: animationcomplete__wormhole">  
      </a-entity>

      <a-entity
        id="maskMan"
        class="clickable"
        geometry="primitive: cylinder; openEnded: true; radius: 0.25" 
        scale="1 1.18 1" 
        position="9.25273 0.73595 4.59736"
        rotation="0 -107 0"
        material="color:#f49eff"
        animation="property:position; from:9.25273 0.73595 4.59736; to:3 0.73595 1; dur:500; dir:alternate; loop:1; easing:easeInOutElastic; startEvents:click">
        <a-plane
          id="mask"
          position="-0.08938 0.49664 0.3"
          rotation="0 0 0"
          src="https://raw.githubusercontent.com/josharaedwards/Project-Anima/266101f50bb8f4167e0f54889eed1f69b0f53704/WebDev/Images/mask1.png"
          material="transparent:true"
          animation__turn="property:rotation; from:0 0 -30; to:0 0 30; dur:1000; dir:alternate; loop:true; easing:easeInOutElastic">
          <a-sphere
            id="leftEye"
            position="-0.1 -0.01 0"
            radius="0.03"
            material="emissive: #f5f2e1; emissiveIntensity: 1.36">
          </a-sphere>
          <a-sphere
            id="rightEye"
            position="0.1 -0.01 0"
            radius="0.03"
            material="emissive: #f5f2e1; emissiveIntensity: 1.36">
          </a-sphere>
        </a-plane>
      </a-entity>

      <a-entity
        id="miniSpirits"
        position="-6.21 3.0864 -4.04048"
        animation__rotate="property:rotation; from:0 0 0; to:0 360 0; dur:2000; loop:true"
        animation__translate="property:position; from: -6.21 3.0864 -4.04048; to: -7 3.1 -4; dur:6000; loop:true; dir:alternate">
        <a-sphere
          id="miniSpirit1"
          position="1 0 0"
          scale="0.05 0.05 0.05"
          rotation="0 0 0"
          material="emissive: #eedddd; emissiveIntensity: 50"
          animation__spin="property:rotation; from:0 0 0; to:120 35 200; dur:1500; easing:easeInElastic; loop:true; dir:alternate"
          animation__jitter="property:position; from:0.6 0 0; to:-0.1 0.3 0; dur:4000; easing:easeInElastic; loop:true; dir:alternate">
          <a-entity
            rotation="0 0 0"
            scale="1.5 1.5 1.5"
            geometry="primitive: octahedron"
            material="emissive: #87edb0; emissiveIntensity: 0.5">
          </a-entity>
        </a-sphere>
        <a-sphere
          id="miniSpirit2"
          position="-3 0 0"
          scale="0.05 0.05 0.05"
          rotation="0 0 0"
          material="emissive: #eedddd; emissiveIntensity: 50"
          animation__spin="property:rotation; from:-0.2 0 0; to:120 35 200; dur:1500; easing:easeInElastic; loop:true; dir:alternate"
          animation__jitter="property:position; from:-0.2 0 0; to:-0.4 -0.35 0; dur:1700; easing:easeInElastic; loop:true; dir:alternate">
          <a-entity
            rotation="0 0 0"
            scale="1.5 1.5 1.5"
            geometry="primitive: octahedron"
            material="emissive: #87edb0; emissiveIntensity: 0.5">
          </a-entity>
        </a-sphere>
      </a-entity>
      

    </a-scene>
  </body>
</html>
