<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-animation-component@^4.1.2/dist/aframe-animation-component.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.x.x/dist/aframe-event-set-component.min.js"></script>
  </head>
  <body>
    <a-scene xr-mode-ui="enabled:false"
              fog="type: linear; color: #0a0a43; far: 45; near: 0"
              loading-screen="dotsColor: red; backgroundColor: black">

      <a-assets>
        <a-asset-item
          id="car"
          src="https://raw.githubusercontent.com/josharaedwards/Project-Anima/b8c4458c12033884799d26aaa85dd0b1784e5a14/WebDev/Models/car.glb">
        </a-asset-item>

        <a-asset-item
          id="streetlight"
          src="https://raw.githubusercontent.com/josharaedwards/Project-Anima/e43d84128f042adfe5f63e25bbd8d66b63c8a4aa/WebDev/Models/streetLight1.glb">
        </a-asset-item>

        <a-asset-item
          id="streetAndSidewalk"
          src="https://raw.githubusercontent.com/josharaedwards/Project-Anima/39e14d0b2f9c8cfa91730a952a063158ead2cd/WebDev/Models/Baobab%20Crossroads.glb"
          >
        </a-asset-item>

        <a-asset-item
          id="train"
          src="https://raw.githubusercontent.com/josharaedwards/Project-Anima/4f2cbdc80459a85b613c8dde9262ab3cf85afe8e/WebDev/Models/Baobab%20Train.glb">
        </a-asset-item>

        <a-mixin
          id="streetlightFrame"
          gltf-model="#streetlight">
        </a-mixin>

        <a-mixin
          id="streetlightLamp"
          geometry="primitive: box"
          material="emissive: #edf104" 
          position="0 3.4 1.32" 
          scale="0.2 0.45 0.2"
          rotation="-90 0 0"
          light="angle: 40; color: #edf104; distance: 100; intensity: 2; penumbra: 0.2; type: spot; castShadow: true">
        </a-mixin>

        <a-mixin
          id="streetlightRay"
          geometry="primitive: sphere; thetaLength: 90"
          material="opacity: 0.3; blending: normal; emissive: #e9e21c; emissiveIntensity: 3"
          position="0 3.37723 1.29403"
          scale="0.5 0.5 0.5"
          rotation="0 -180 -180">
        </a-mixin>

      </a-assets>

      <a-entity
        id="pc"
        camera
        look-controls="enabled:true; magicWindowTrackingEnabled:true"
        wasd-controls="enabled:false"
        position="0 2 0">
        <a-entity
          raycaster="objects:.clickable"
          cursor="fuse:true; fuseTimeout:800"
          geometry="primitive:triangle; vertexA:0 -0.040 0; vertexB: -0.050 -0.1 0; vertexC:0.050 -0.1 0"
          material="color:#83f9fb; shader:flat"
          position="0 0 -2"
          scale="1 1 1"
          animation__fusing="property:scale; from: 1 1 1; to:0.2 0.2 0.2; startEvents:fusing"
          animation__reset="property:scale; to:1 1 1; dur: 100; startEvents:mouseleave">
          <a-circle
            position="0 -0.07 0.5"
            scale="0.4 0.4 0.4"
            radius="0.05"
            material="color:#f2f75e; shader:flat">
          </a-circle>
          <a-triangle
            scale="1.1 1 1"
            material="color:black; shader:flat; wireframe:true"
            vertex-a="0 -0.040 0"
            vertex-b="-0.050 -0.1 0"
            vertex-c="0.050 -0.1 0">
          </a-triangle>
        </a-entity>
      </a-entity>

      <a-sky
        id="sky"
        src="https://raw.githubusercontent.com/josharaedwards/Project-Anima/42b995f0c959db1ce651d383349005225226df89/WebDev/Images/sky2.jpg"
        radius="70"
        material="emissive: #eedddd; emissiveIntensity: 50">
      </a-sky>

      <a-entity
        id="moon"
        geometry="primitive:sphere"
        material="color:white; emissive:#e8803b; emissiveIntensity:2"
        light="type: point; color: #9f77fd; castShadow: true; shadowBias: -0.1; intensity: 15"
        position="4.7 11 -10">
      </a-entity>

      <a-entity
        id="car"
        class="clickable"
        gltf-model="#car"
        position="-3.85692 0 -12"
        rotation="0 83 0"
        animation__hover="property:position; dir:alternate; dur:2400; loop:1; easing:easeInSine; from:-3.85692 0 -12; to:-3.85692 0.9 -12; startEvents: click"
        animation__tilt="property:rotation; dir:alternate; dur:1500; delay:600; loop:1; easing:easeInOutQuad; from:0 83 0; to:7 83 -5; startEvents: click">
        <a-entity 
          id="wheel1"
          geometry="primitive: circle; radius: 0.37; segments: 16" 
          position="-0.88407 0.39659 0.98941" 
          material="emissive: #89e8f5; emissiveIntensity: 1.36; wireframe: true; wireframeLinewidth: 1"
          animation__wheelSpin="property:rotation; dir:alternate; dur:800; easing:easeInSine; loop:true; to: 0 0 270">
        </a-entity>
        <a-entity 
          id="wheel2" 
          geometry="primitive: circle; radius: 0.37; segments: 16"
          position="1.05146 0.39659 0.98941" 
          material="emissive: #89e8f5; emissiveIntensity: 1.36; wireframe: true; wireframeLinewidth: 1"
          animation__wheelSpin="property:rotation; dir:alternate; dur:800; easing:easeInSine; loop:true; to: 0 0 270">
        </a-entity>
        <a-entity
          id="underLight"
          light="color: #89e8f5; distance:3; intensity:2; type: point">
        </a-entity>
        <a-entity
          id="grill"
          geometry="primitive:box"
          position="-1.69529 0.56764 0.06821" 
          scale="0.26649 0.307 1.21612"
          material="emissive: #27e619; emissiveIntensity:2; wireframe: false; wireframeLinewidth: 5">
        </a-entity>
      </a-entity>

      <a-entity
        id="jaera">
        <a-plane
          id="jaeRaBody"
          position="0 1.4 -4"
          scale="2.5 2.5 1"
          src="https://raw.githubusercontent.com/josharaedwards/Project-Anima/b24559ca6550d6bc9f85e590dde783d827ba7730/WebDev/Images/jaeraStanding.png"
          material="transparent:true">
          <a-plane
            id="jaeRaCollider"
            class="clickable"
            position="0 -0.04392 0.07687"
            scale="0.44487 0.8764 1"
            material="alphaTest: 1; opacity: 0"
            event-set__maskOn="_event: mouseenter; _target: #jaeRaMask; visible: true"
            event-set__maskOff="_event: mouseleave; _target: #jaeRaMask; visible: false"
            event-set__waveActive="_event: click; _target: #jaeRaLight; animation__wave.to: 4.5; animation__wave.loop: 0"
            event-set__magicPulseActive="_event: click; _target: #jaeRaMagic; animation__magicPulse.to: 0.6; animation__magicPulse.loop: 0"
            event-set__magicSpinActive="_event: click; _target: #jaeRaMagic; animation__magicSpin.dur: 2000"
            event-set__anomalyPortalActive="_event: click; _target: #anomalyPortal; animation__portalTranslate.from: 1.8 -0.7 -4.2;  animation__portalTranslate.to: 1.8 1.15 -4.2"
            event-set__rightHandActive="_event: click; _target: #rightMudHand; animation__handTranslate.from: 1.8 -1 -4.2; animation__handTranslate.to: 1.8 0.5 -4.2"
            event-set__asePortalActive="_event: click; _target: #asePortal; animation__portalTranslate.from: -1.8 -0.7 -4.2;  animation__portalTranslate.to: -1.8 1.15 -4.2"
            event-set__leftHandActive="_event: click; _target: #leftMudHand; animation__handTranslate.from: -1.8 -1 -4.2; animation__handTranslate.to: -1.8 0.5 -4.2"
            event-set__resetActive="_event: click; _target: #resetMagic; animation__resetTranslate.from: 0 -0.7 -2.5;  animation__resetTranslate.to: 0 0.5 -2.5">
          </a-plane>
          <a-plane
            id="jaeRaMask" 
            position="-0.046 0.22515 0.107" 
            scale="0.18 0.18 1" 
            src="https://raw.githubusercontent.com/josharaedwards/Project-Anima/b24559ca6550d6bc9f85e590dde783d827ba7730/WebDev/Images/jaeraMask.png"
            material="alphaTest: 1; transparent:true">
          </a-plane>
          <a-plane
            id="jaeRaMagic"
            position="0.16 0.33817 -0.107"
            scale="0.4 0.4 1"
            src="https://raw.githubusercontent.com/josharaedwards/Project-Anima/1f0a1500573a8b8784190bf1c6d9db79994f4936/WebDev/Images/jaeRaSigil.png"
            material="alphaTest: 1; transparent:true"
            animation__magicSpin="property:rotation; dur:6000; easing:easeInSine; loop:true; from: 0 0 0; to: 0 0 360"
            animation__magicPulse="property:scale; dur:2000; dir:alternate; easing:easeInSine; loop:true; from: 0.4 0.4 1; to: 0.5 0.5 1">
          </a-plane>
        </a-plane>
        <a-light 
          id="jaeRaLight"
          type="point" 
          position="0.48385 2.23 -3.52736" 
          light="color: #f0eee4; distance: 4; intensity: 3"
          animation__wave="property:distance; dir:alternate; dur:2000; easing:easeInSine; loop:true; from:4; to:2">
        </a-light>
      </a-entity>

      <a-entity 
        id="anomalyPortal"
        class="clickable" 
        geometry="" 
        position="1.8 -0.7 -4.2" 
        scale="0.55 0.77 0.11"
        material="shader: flat; color: #ffffff; src: https://raw.githubusercontent.com/josharaedwards/Project-Anima/aa7f63717e720f51c05f4140b1923f75edc73c7f/WebDev/Images/anomalyCover.png"
        animation__wormhole="property:rotation; from: 0 0 0; to: 0 360 0; dur 2000; startEvents:fusing"
        animation__reset="property:rotation; to: 0 0 0; dur 100; startEvents:mouseleave"
        link="backgroundColor: #b324c6; href: https://jesgrewsoul.itch.io/anomaly-zine-by-jaera; on: animationcomplete__wormhole"
        animation__portalTranslate="property:position; from: 1.8 -0.7 -4.2; to: 1.8 -0.7 -4.2; dur: 1000">  
      </a-entity>

      <a-entity
        id="rightMudHand"
        geometry="plane"
        position="1.8 -1 -4.2"
        scale="1 1.99472 0.01"
        material="opacity: 0.9; src: https://raw.githubusercontent.com/josharaedwards/Project-Anima/da65f1bb6c864634fb33765a1c65cd3022228e32/WebDev/Images/mudHandGreen.png"
        animation__handGlow="property:material.emissive; from:#000000; to:#6b0000; dur: 3000; loop:true; dir:alternate"
        animation__handTranslate="property:position; from: 1.8 -1 -4.2; to: 1.8 -1 -4.2; dur: 1000">
      </a-entity>

      <a-entity 
        id="asePortal"

        position="-1.8 -0.7 -4.2" 
        scale="0.55 0.77 0.11"

        animation__wormhole="property:rotation; from: 0 0 0; to: 0 360 0; dur 2000; startEvents:fusing"
        animation__reset="property:rotation; to: 0 0 0; dur 100; startEvents:mouseleave"
        link="backgroundColor: #b324c6; href: https://jesgrewsoul.itch.io/ase-zine-by-jaera; on: animationcomplete__wormhole"

        animation__handGlow="property:material.emissive; from:#000000; to:#6b0000; dur: 3000; loop:true; dir:alternate"
        animation__handTranslate="property:position; from: -1.8 -1 -4.2; to: -1.8 -1 -4.2; dur: 1000">

      <a-entity
        id="resetMagic"
        class="clickable"
        geometry=""
        position="0 0.5 -2.5"
        scale="0.5 0.5 0.5"
        material="blending: additive; color: #ffffff; src: https://raw.githubusercontent.com/josharaedwards/Project-Anima/606452d584463682f7b50325b5ad2a5a6c622b36/WebDev/Images/dispelText.png"
        animation__resetTranslate="property:position; from: 0 -0.7 -2.5; to: 0 -0.7 -2.5; dur: 2000"
        event-set__waveInactive="_event: click; _target: #jaeRaLight; animation__wave.to: 3.5; animation__wave.loop: true"
        event-set__magicPulseInactive="_event: click; _target: #jaeRaMagic; animation__magicPulse.to: 0.5; animation__magicPulse.loop: true"

        event-set__resetInactive="_event: click; _target: #resetMagic; animation__resetTranslate.from: 0 0.5 -2.5;  animation__resetTranslate.to: 0 -0.7 -2.5">
      </a-entity>

      <a-entity 
        id="streetlight_NW_R1" 
        mixin="streetlightFrame" 
        position="-7.67 0.5 -5.96" 
        rotation="0 0 0">
        <a-entity
          id="spiritLight" 
          mixin="streetlightLamp"
          animation__lightfade="property: light.angle; from: 40; to: 5; loop: true; easing: easeInElastic; dur: 2000; dir: alternate"
          animation__emissivefade="property: material.emissiveIntensity; from: 1; to: 0.2; loop: true; easing: easeInElastic; dur: 2000; dir: alternate">
          </a-entity>
        <a-entity
          id="spiritGlow"
          class="clickable"
          event-set__turnOffGlow="_event: click; _target:#spiritGlow; animation__lightfade.to: 0 0 0; animation__lightfade.loop: 0; animation__lightfade.easing: easeInOutSine"
          event-set__turnOffLight="_event: click; _target:#spiritLight; animation__lightfade.to: 0 0 0; animation__lightfade.loop: 0; animation__lightfade.easing: easeInOutSine; animation__emissivefade.to: 0; animation__emissivefade.loop: 0; animation__emissivefade.easing: easeInOutSine"
          event-set__shooSpirits="_event: click; _target:#miniSpirits; animation__translate.to: -11.256 8.523 -20.46057; animation__translate.loop: 0" 
          mixin="streetlightRay"
          animation__lightfade="property: scale; from: 0.5 0.5 0.5; to: 0.2 0.2 0.2; dir: alternate; loop: true; easing: easeInElastic; dur: 2000">
        </a-entity>

        animation__rotate="property:rotation; from: 0 -75.2706114619265 0; to: 8.770837927862642 -78.1199305771121 -35.93648586840037; dur:4500; easing:easeInElastic; loop:true; dir:alternate"
